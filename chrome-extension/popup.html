<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GenASL</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        width: 320px;
        margin: 0;
        padding: 14px 16px;
        color: #1f2328;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 6px;
        font-weight: 600;
      }
      .sub {
        font-size: 12px;
        color: #57606a;
        margin: 0 0 12px;
      }
      .status {
        font-size: 12px;
        padding: 6px 8px;
        border-radius: 6px;
        background: #f6f8fa;
        border: 1px solid #d0d7de;
      }
      .status.ok { background: #dafbe1; border-color: #1a7f37; }
      .status.warn { background: #fff8c5; border-color: #9a6700; }
      .status.err { background: #ffebe9; border-color: #cf222e; }
      .row { margin-bottom: 8px; }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        background: #f6f8fa;
        padding: 1px 4px;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <h1>GenASL — Interpreter Avatar</h1>
    <p class="sub">Audio → 3D-avatar ASL overlay (pipeline in build-out).</p>

    <div class="row">
      <div id="api-status" class="status">Checking local API…</div>
    </div>
    <div class="row" style="font-size: 11px; color: #57606a;">
      Start the server with <code>python -m src.api.server</code>.
      Implementation roadmap lives in <code>docs/plan/</code> in the
      repository.
    </div>

    <script src="popup.js"></script>
  </body>
</html>
