# GenASL Pipeline Configuration (interpreter_avatar mode).
#
# All defaults live in src/core/config.py (Pydantic Settings). This file
# overrides only what differs from the defaults for this checkout.

# --- LLM provider for the interpreter brain (Stage 4) ---
# Supported providers: ollama (local, free), gemini (free tier), openai
#
# Ollama  — runs locally, no API key needed.  Install: https://ollama.com
#           Then: ollama pull llama3.2
# Gemini  — free tier, set GEMINI_API_KEY env variable
# OpenAI  — set OPENAI_API_KEY env variable
llm:
  provider: "gemini"          # ollama | gemini | openai

  ollama:
    model: "gemma3:4b"
    base_url: "http://localhost:11434/v1"

  gemini:
    model: "gemini-2.0-flash"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    # key via env: GEMINI_API_KEY

  openai:
    model: "gpt-4o-mini"
    # key via env: OPENAI_API_KEY

# --- Audio analysis (Stages 1–2) ---
audio:
  asr_model: "small"          # tiny | base | small | medium
  asr_compute_type: "int8"    # int8 keeps CPU inference fast
  asr_language: "en"
  vad_min_silence_ms: 500
  prosody_frame_ms: 50
  emotion_window_ms: 4000

# --- Interpreter LLM (Stages 3–4) ---
interpreter:
  max_chunk_chars: 240
  min_chunk_chars: 20
  temperature: 0.2
  include_role_shifts: true
  include_classifiers: true

# --- 3D avatar / motion synthesis (Stages 5–6) ---
avatar:
  rig: "vrm"
  # Free Ready Player Me model URL; override with your own RPM avatar URL.
  vrm_model_url: "https://models.readyplayer.me/64bfa15f0e72c63d7c3934a6.glb"
  frame_rate: 30
  sign_default_duration_ms: 600
  transition_ms: 120
  pip_width_ratio: 0.30

# --- Corpus retrieval (Phase 4) ---
# OpenASL = primary phrase-level retrieval corpus.
# ASL Citizen = secondary lexical fallback (per-gloss).
# WLASL = last-resort gloss stitching (Phase 4 also builds a 500-gloss subset).
#
# embedding_model is shared between build_corpus_index.py and the runtime
# RetrievalIndex; changing it invalidates the index.
retrieval:
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  phrase_threshold: 0.55
  lexical_threshold: 0.70
  max_duration_drift: 0.40
  max_clip_duration_ms: 12000
  primary_corpus: "openasl"
  secondary_corpus: "aslcitizen"

# --- BBC Learning English test videos (Easy English Conversations) ---
test_videos:
