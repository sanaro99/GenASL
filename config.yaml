# GenASL Pipeline Configuration
#
# All defaults live in src/core/config.py (Pydantic Settings). This file
# overrides only what differs from the defaults for this checkout.

# --- LLM provider for English-to-ASL gloss translation ---
# Supported providers: ollama (local, free), gemini (free tier), openai
#
# Ollama  — runs locally, no API key needed.  Install: https://ollama.com
#           Then: ollama pull llama3.2
# Gemini  — free tier, set GEMINI_API_KEY env variable
# OpenAI  — set OPENAI_API_KEY env variable
llm:
  provider: "ollama"          # ollama | gemini | openai

  ollama:
    model: "gemma3:4b"
    base_url: "http://localhost:11434/v1"

  gemini:
    model: "gemini-2.0-flash"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    # key via env: GEMINI_API_KEY

  openai:
    model: "gpt-4o-mini"
    # key via env: OPENAI_API_KEY

build:
  # Signer preference chain — try signer 9 first (91% keyword coverage,
  # consistent framing from asl5200), then 109, then 12, then any.
  preferred_signer_ids: [9, 109, 12]

# --- Pipeline mode toggle ---
# genai_gloss        — word-level WLASL clip stitching (the original pipeline)
# interpreter_avatar — audio-driven 3D-avatar pipeline (Phases 2–7)
pipeline:
  mode: "genai_gloss"

# --- interpreter_avatar mode: audio analysis ---
audio:
  asr_model: "small"          # tiny | base | small | medium
  asr_compute_type: "int8"    # int8 keeps CPU inference fast
  asr_language: "en"
  vad_min_silence_ms: 500
  prosody_frame_ms: 50
  emotion_window_ms: 4000

# --- interpreter_avatar mode: interpreter LLM ---
interpreter:
  max_chunk_chars: 240
  min_chunk_chars: 20
  temperature: 0.2
  include_role_shifts: true
  include_classifiers: true

# --- interpreter_avatar mode: 3D avatar / motion ---
avatar:
  rig: "vrm"
  # Free Ready Player Me model URL; override with your own RPM avatar URL.
  vrm_model_url: "https://models.readyplayer.me/64bfa15f0e72c63d7c3934a6.glb"
  frame_rate: 30
  sign_default_duration_ms: 600
  transition_ms: 120
  pip_width_ratio: 0.30

# --- BBC Learning English test videos (Easy English Conversations) ---
test_videos:
  - id: "I_tRSrPru94"
    title: "Easy English Conversations Episode 1"
  - id: "31y2Bq1RYQA"
    title: "Easy English Conversations Episode 2"
  - id: "on_1sS6Ii8M"
    title: "Easy English Conversations Episode 3"
